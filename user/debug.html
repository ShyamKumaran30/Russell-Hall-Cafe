<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fix Orders - Russell Hall Café</title>
  <style>
    body { background: #0d0d0d; color: #e0d5c5; font-family: monospace; padding: 2rem; max-width: 800px; margin: 0 auto; }
    h2 { color: #e8a825; }
    .box { background: #1a1209; border: 1px solid #3a2a10; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .ok { color: #27ae60; }
    .err { color: #e74c3c; }
    .warn { color: #e8a825; }
    .btn { background: #e8a825; color: #0d0d0d; border: none; padding: 1rem 2rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; margin: 0.5rem 0.5rem 0.5rem 0; display: inline-block; }
    .btn-red { background: #e74c3c; color: #fff; }
    .btn-green { background: #27ae60; color: #fff; font-size: 1.3rem; padding: 1.2rem 2.5rem; }
    #log { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 1rem; max-height: 300px; overflow-y: auto; font-size: 0.85rem; line-height: 1.8; margin-top: 1rem; }
  </style>
</head>
<body>
  <h2>🔧 Russell Hall Café — Fix My Orders</h2>

  <div class="box" id="auth-status">Checking login...</div>

  <div class="box" style="border-color:#27ae60; background:rgba(39,174,96,0.08);">
    <p style="color:#27ae60; font-size:1.1rem; font-weight:bold; margin:0 0 0.5rem 0;">⬇️ ONE CLICK FIX</p>
    <p style="margin:0 0 1rem 0; color:#e0d5c5;">This button will find ALL orders in the database and link them to your current account automatically.</p>
    <button class="btn btn-green" onclick="fixAllOrders()">🔗 Fix All My Orders Now</button>
  </div>

  <div id="log" style="display:none;"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5Oj6hCzedhggjLJf5u6JqTS8zPO3J5sg",
      authDomain: "russell-hall-cafe.firebaseapp.com",
      projectId: "russell-hall-cafe",
      storageBucket: "russell-hall-cafe.firebasestorage.app",
      messagingSenderId: "700946954798",
      appId: "1:700946954798:web:4686e94d38427962ddfdbf"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const logEl = document.getElementById('log');
    const authEl = document.getElementById('auth-status');

    function log(msg, type = 'info') {
      logEl.style.display = 'block';
      const colors = { ok: '#27ae60', err: '#e74c3c', warn: '#e8a825', info: '#e0d5c5' };
      logEl.innerHTML += `<div style="color:${colors[type] || '#e0d5c5'}">${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        authEl.innerHTML = `
          <span class="ok">✅ Logged in as: <strong>${user.email}</strong></span><br>
          <span style="font-size:0.8rem; opacity:0.7;">UID: ${user.uid}</span>
        `;
      } else {
        authEl.innerHTML = `<span class="err">❌ NOT LOGGED IN<br><br>
          <a href="/" style="color:#e8a825;">Go to the main site and log in first</a>, then come back here.</span>`;
      }
    });

    async function fixAllOrders() {
      const user = auth.currentUser;
      if (!user) {
        log('❌ You are not logged in. Go to the main site, log in, then come back here.', 'err');
        return;
      }

      log(`🔍 Searching all orders to link to your account (${user.email})...`, 'warn');

      try {
        // Load ALL orders in the database
        const allSnap = await db.collection('orders').limit(100).get();
        log(`Found ${allSnap.size} total order(s) in database`, 'info');

        if (allSnap.size === 0) {
          log('❌ No orders in the database at all.', 'err');
          return;
        }

        let fixed = 0;
        let alreadyYours = 0;
        let skipped = 0;

        const batch = db.batch();

        allSnap.forEach(doc => {
          const d = doc.data();
          const orderEmail = (d.customerDetails?.email || d.userEmail || '').toLowerCase().trim();
          const userEmail = user.email.toLowerCase().trim();
          const isTestOrder = doc.id.startsWith('test_') || (d.orderId || '').startsWith('test_');
          const isUserEmailMatch = orderEmail === userEmail || 
                                   (orderEmail.includes('shyamgjk') && userEmail.includes('shyamgjk'));

          if (d.userId === user.uid) {
            alreadyYours++;
            log(`  ✅ Order ${doc.id} — already yours`, 'ok');
          } else if (isTestOrder) {
            skipped++;
            log(`  ⏭️ Order ${doc.id} — skipped (test order)`, 'info');
          } else if (isUserEmailMatch) {
            // Link this order to current user
            batch.update(doc.ref, { userId: user.uid });
            fixed++;
            log(`  🔗 Order ${doc.id} (placed by: ${orderEmail || 'unknown'}) → linking to your account`, 'warn');
          } else {
            skipped++;
            log(`  ⏭️ Order ${doc.id} (placed by: ${orderEmail || 'unknown'}) — skipped (other customer)`, 'info');
          }
        });

        if (fixed > 0) {
          await batch.commit();
          log(``, 'info');
          log(`✅ SUCCESS! Linked ${fixed} order(s) to your account.`, 'ok');
          log(``, 'info');
          log(`🎉 Go back to the main site → My Account → Order History`, 'ok');
          log(`Your orders will now appear!`, 'ok');
        } else {
          log(``, 'info');
          log(`✅ All ${alreadyYours} order(s) already belong to your account.`, 'ok');
          log(`If you still don't see them, wait 1 minute for the site to update and refresh.`, 'warn');
        }

      } catch (err) {
        log(`❌ Error: ${err.code} — ${err.message}`, 'err');
        if (err.code === 'permission-denied') {
          log(`Firestore rules are blocking this. Make sure you published the rules in Firebase Console → Firestore → Rules.`, 'err');
        }
      }
    }
  </script>
</body>
</html>
